[package]
name = "vesta-server-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chrono = "0.4"
ed25519-dalek = { version = "2.2", features = ["zeroize"] }
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tempfile = "3.27"
fs2 = "0.4"
uuid = { version = "1.23.2", features = ["v4"] }
tokio = { version = "1.49", features = ["sync", "time", "net", "rt", "macros", "fs", "io-util"] }
tokio-tungstenite = { version = "0.24.0", features = ["rustls-tls-webpki-roots"] }
url = "2.5"
zeroize = { version = "1", features = ["serde"] }

[dev-dependencies]
rcgen = "0.13"
hyper = { version = "0.14", features = ["server", "http1", "tcp"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1.49", features = ["full", "test-util"] }

tempfile = "3.27"
rand = "0.10.1"
uuid = { version = "1.23.2", features = ["v4"] }

[target.'cfg(windows)'.dev-dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
[target.'cfg(target_os = "macos")'.dev-dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }
[target.'cfg(target_os = "linux")'.dev-dependencies]
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
