[package]
name = "vesta-sandbox"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Portable OS sandbox policy and spawn preparation for Vesta Launcher"
license.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.18"
tempfile = "3"
which = "8.0.0"

[target.'cfg(target_os = "linux")'.dependencies]
# Keep the shared helper compatible with the server's libc 0.2.183 baseline.
# Vesta uses Execute/Refer and hard enforcement, not the newer ABI 7–9 APIs.
landlock = "=0.4.4"

[target.'cfg(target_os = "windows")'.dependencies]
rappct = "0.13.3"
zip = { version = "8.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[[bin]]
name = "vesta-sandbox-exec"
path = "src/bin/vesta-sandbox-exec.rs"
