[workspace]
[package]
name = "vesta-pake-conformance"
version = "0.0.0"
edition = "2024"
publish = false
[dependencies]
rustls = { version = "=0.23.37", default-features = false, features = ["ring", "std"] }
vesta-host-client = { path = "../.." }
zeroize = "=1.9.1"
sha2 = "=0.10.9"
uuid = { version = "=1.23.2", features = ["v4"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
[dev-dependencies]
serde_json = "=1.0.149"
rand_chacha = "=0.3.1"
hex = "=0.4.3"
rustls = { version = "=0.23.37", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "=1.14.0", features = ["std"] }
