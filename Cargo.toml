[workspace]
resolver = "2"
members = ["vesta-launcher/src-tauri", "crates/piston-lib", "crates/vesta-sandbox"]

[workspace.package]
version = "0.1.0-alpha.32"
authors = ["Eatham532"]
edition = "2021"
description = "A Minecraft launcher built with Tauri and SolidJS"
license = "GPL-3.0-or-later"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
